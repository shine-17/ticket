spring.application.name=ticket

spring.config.import=optional:file:.env[.properties]

server.tomcat.threads.max=300
server.tomcat.threads.min-spare=30

# ===============================
# PostgreSQL DataSource
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=admin
spring.datasource.password=1234
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# MySQL DataSource
# ===============================
#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ticket
#spring.datasource.username=root
#spring.datasource.password=1234
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# hibernate setting
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.format_sql=true

# SQL log
spring.jpa.properties.hibernate.show_sql=true
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.generate-ddl=true
spring.jpa.show_sql=true
spring.jpa.defer-datasource-initialization=true

# dummy data
#spring.sql.init.data-locations=classpath*:db/data.sql
#spring.sql.init.mode=always
#spring.sql.init.platform=postgresql
spring.sql.init.encoding=UTF-8

# repository
#spring.profiles.active=jpa

# ===============================
# Redis
# ===============================
spring.data.redis.host=${REDIS_URL}
spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3s

spring.data.redis.lettuce.pool.max-active=200
spring.data.redis.lettuce.pool.max-idle=100
spring.data.redis.lettuce.pool.min-idle=20
spring.data.redis.lettuce.pool.max-wait=100ms

# ===============================
# Virtual Thread
# ===============================
spring.threads.virtual.enabled=true